---
- name: Criar o namespace do ArgoCD
  kubernetes.core.k8s:
    name: argocd
    api_version: v1
    kind: Namespace
    state: present

- name: Instalar o ArgoCD via manifesto oficial estavel
  kubernetes.core.k8s:
    state: present
    src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    namespace: argocd

- name: Enviar o App of Apps raiz para o cluster
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'root-app.yaml.j2') | from_yaml }}"
    namespace: argocd
