---
- name: Criar o namespace do ArgoCD
  shell: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Baixar manifesto do ArgoCD para o servidor
  get_url:
    url: "{{ argocd_manifest_url | default('https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/install.yaml') }}"
    dest: /tmp/argocd-install.yaml
    mode: "0644"

- name: Instalar ou atualizar o ArgoCD usando o manifesto local
  command: kubectl apply -n argocd -f /tmp/argocd-install.yaml
  register: argocd_apply
  changed_when: "'unchanged' not in argocd_apply.stdout"
  retries: 3
  delay: 15
  until: argocd_apply.rc == 0

# ArgoCD leva 2-4 min no A1 Flex. Aplicar root-app antes disso gera
# CrashLoop / i/o timeout enganosos. Espera explícita aqui.
- name: Aguardar deployments do ArgoCD ficarem Available
  command: >
    kubectl -n argocd wait --for=condition=Available deploy
    --all --timeout=600s
  register: argocd_wait
  retries: 2
  delay: 30
  until: argocd_wait.rc == 0
  changed_when: false

- name: Enviar o App of Apps raiz para o cluster
  template:
    src: root-app.yaml.j2
    dest: /tmp/root-app.yaml

- name: Aplicar o App of Apps no cluster
  command: kubectl apply -n argocd -f /tmp/root-app.yaml
  register: root_apply
  changed_when: "'unchanged' not in root_apply.stdout"
  retries: 3
  delay: 10
  until: root_apply.rc == 0
