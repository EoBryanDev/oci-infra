---
- name: Criar o namespace do ArgoCD
  command: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

- name: Instalar o ArgoCD via manifesto oficial estavel
  command: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

- name: Enviar o App of Apps raiz para o cluster
  template:
    src: root-app.yaml.j2
    dest: /tmp/root-app.yaml

- name: Aplicar o App of Apps no cluster
  command: kubectl apply -n argocd -f /tmp/root-app.yaml
