---
- name: Remover travas órfãs do APT se existirem
  command: rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
  ignore_errors: true

- name: Parar processos travados do apt/dpkg
  command: pkill -9 apt apt-get dpkg
  ignore_errors: true

- name: Atualizar cache do APT
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Instalar pacotes essenciais e suporte a Python
  apt:
    name:
      - curl
      - git
      - ufw
      - open-iscsi
      - iptables-persistent
      - python3-pip
      - python3-dev
    state: present

- name: Liberar tráfego interno no iptables (Exigência OCI)
  iptables:
    chain: INPUT
    action: insert
    rule_num: 1
    source: 10.0.0.0/16
    jump: ACCEPT

- name: Salvar regras do firewall
  command: netfilter-persistent save
