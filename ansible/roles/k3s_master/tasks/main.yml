---
- name: Instalar K3s Master
  shell: |
    curl -sfL https://get.k3s.io | sh -s - server \
      --write-kubeconfig-mode 644 \
      --node-external-ip {{ ansible_host }}
  args:
    creates: /usr/local/bin/k3s # Impede que o Ansible reinstale se já existir

- name: Aguardar a geração do Token do Cluster
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token

- name: Capturar o Token do K3s
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token_raw

- name: Salvar Token como variável global
  set_fact:
    k3s_token: "{{ node_token_raw.content | b64decode | trim }}"
