apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    # Mesmo motivo do kube-prometheus: schema 1.36 vs Argo 2.14.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.0
    helm:
      valuesObject:
        # CRDs instalados uma vez via bootstrap manual
        # (kubectl apply --server-side, documentado no README da fase).
        # Motivo: CRDs >256KB quebram apply client-side e o structured-merge
        # do Argo 2.14 não conhece schemas do K8s 1.36. Mudam só em upgrade
        # de operator (manual, com o mesmo bootstrap).
        crds:
          create: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
