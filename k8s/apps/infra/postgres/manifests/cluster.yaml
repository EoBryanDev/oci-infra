apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-main
  namespace: databases
spec:
  description: "Postgres principal do portfolio (single + backups S3 no OCI)"
  instances: 1
  # Major pinada; minors flutuam com o operator (reprodutível sem surpresa de major).
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  postgresql:
    parameters:
      max_connections: "100"
  # OCI S3-compat rejeita `Content-Encoding: aws-chunked` (501 NotImplemented)
  # que SDKs novos adicionam por default. `when_required` força uploads plain.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
  bootstrap:
    initdb:
      database: appdb
      owner: app
      # Sem `secret:` custom: o operator cria `pg-main-app` sozinho.
      # (Nome custom exigiria Secret pré-existente; o operator não gera.)
  monitoring:
    enablePodMonitor: true
  # ---------------------------------------------------------------------------
  # Backup pelo plugin CNPG-I (Barman Cloud Plugin).
  #
  # Migrado em 18/10/2026 do caminho nativo `spec.backup.barmanObjectStore`,
  # que o CNPG 1.31 REMOVE. A config S3 saiu daqui e virou o CR `ObjectStore`
  # (objectstore.yaml) — mesmo bucket/prefixo/credenciais, catálogo de backups
  # existente reaproveitado. O `retentionPolicy: "1w"` também mudou de lugar
  # (agora no ObjectStore).
  #
  # `isWALArchiver: true` = este plugin passa a ser QUEM arquiva os WALs do
  # cluster (substitui o archiver nativo do operator).
  #
  # VERIFICAÇÃO OBRIGATÓRIA logo após o apply (é o único ponto de risco da
  # migração: WAL que não é arquivado enche o PVC de 10Gi e trava o banco):
  #   kubectl -n databases get cluster pg-main \
  #     -o jsonpath='{range .status.conditions[*]}{.type}={.status}{"\n"}{end}'
  # Precisa conter `ContinuousArchiving=True`. Se não contiver, `git revert`
  # deste commit e o ArgoCD devolve o estado anterior sozinho.
  # ---------------------------------------------------------------------------
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-main-store
