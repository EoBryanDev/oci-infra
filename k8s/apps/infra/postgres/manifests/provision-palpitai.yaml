apiVersion: batch/v1
kind: Job
metadata:
  name: provision-palpitai
  namespace: databases
  annotations:
    # Roda após o Cluster existir. Job completo não re-executa no sync.
    # Bootstrap one-time (fora do Git): app precisa de CREATEDB/CREATEROLE
    # e membership em palpitai_app (ver runbook da migração Neon).
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision
          image: docker.io/library/postgres:17
          env:
            - name: PGHOST
              value: pg-main-rw
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: pg-main-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-main-app
                  key: password
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # 1. Role (DO block é transacional — OK para roles).
              psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
              DO $do$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'palpitai_app') THEN
                  CREATE ROLE palpitai_app LOGIN CONNECTION LIMIT 20;
                END IF;
              END
              $do$;
              GRANT palpitai_app TO SESSION_USER;
              SQL
              # 2. Database via createdb (fora de transação — CREATE DATABASE
              #    não roda dentro de bloco transacional nem em DO).
              if ! psql -d postgres -tAc \
                "SELECT 1 FROM pg_database WHERE datname='palpitai'" | grep -q 1; then
                createdb -O palpitai_app palpitai
              fi
              # 3. Guardrails por projeto.
              psql -d postgres -v ON_ERROR_STOP=1 \
                -c "ALTER ROLE palpitai_app IN DATABASE palpitai SET statement_timeout = '30s';"
              echo "provision palpitai OK"
  backoffLimit: 3
