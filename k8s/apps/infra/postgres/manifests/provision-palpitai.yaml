apiVersion: batch/v1
kind: Job
metadata:
  name: provision-palpitai
  namespace: databases
  annotations:
    # Roda após o Cluster existir. Job completo não re-executa no sync.
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision
          image: docker.io/library/postgres:17
          env:
            - name: PGHOST
              value: pg-main-rw
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-main-superuser
                  key: password
          command:
            - psql
            - -d
            - postgres
            - -v
            - ON_ERROR_STOP=1
            - -c
            - |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'palpitai_app') THEN
                  CREATE ROLE palpitai_app LOGIN CONNECTION LIMIT 20;
                END IF;
              END
              $$;
              SELECT 'CREATE DATABASE palpitai OWNER palpitai_app'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'palpitai')\gexec
              ALTER ROLE palpitai_app IN DATABASE palpitai SET statement_timeout = '30s';
  backoffLimit: 3
