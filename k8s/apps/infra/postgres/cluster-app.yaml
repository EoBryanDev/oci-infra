apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pg-main
  namespace: argocd
  annotations:
    # O Cluster só sincroniza depois do operator existir (CRDs presentes).
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/EoBryanDev/oci-infra.git
    targetRevision: HEAD
    path: k8s/apps/infra/postgres/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
