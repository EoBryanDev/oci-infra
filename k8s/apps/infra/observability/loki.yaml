apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.3.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary # 1 réplica (suficiente p/ 24h de retenção)
        # Caches desligados: num cluster de 2x12GB, os memcached default
        # (chunks ~10GB) estourariam os nodes. Sem eles, query segue ok.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        # Canary (sonda sintética, 1 pod por node) e pod de helm-test:
        # dispensáveis aqui; menos 3 pods no cluster.
        lokiCanary:
          enabled: false
        test:
          enabled: false
        # Zera os targets do modo SimpleScalable (default 3 cada): sem isso o
        # chart 7.x recusa o render (single binary + SSD ao mesmo tempo).
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          # Schema obrigatório (chart 7.x não tem default): tsdb + filesystem,
          # padrão documentado para single binary.
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          compactor:
            retention_enabled: true
            # Obrigatório quando retention está ligada (erro: delete-request-store).
            delete_request_store: filesystem
          limits_config:
            retention_period: 24h # retenção mínima (decisão: custo zero de disco)
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 5Gi
            storageClass: local-path
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
