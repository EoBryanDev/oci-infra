apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.173.1
    helm:
      valuesObject:
        mode: deployment
        replicaCount: 1
        # Imagem contrib: o exporter `loki` não existe na imagem core.
        # Tag default = appVersion do chart (0.160.0).
        image:
          repository: otel/opentelemetry-collector-contrib
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
          otlp:
            enabled: true
          otlp-http:
            enabled: true
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
          metrics:
            enabled: true
        serviceMonitor:
          enabled: true
        config:
          exporters:
            # Métricas OTLP das suas apps -> Prometheus (scrape em :8889)
            prometheus:
              endpoint: 0.0.0.0:8889
            # Traces OTLP -> Tempo (OTLP gRPC sem TLS dentro do cluster)
            otlp_grpc/tempo:
              endpoint: tempo.monitoring.svc.cluster.local:4317
              tls:
                insecure: true
            # Logs OTLP -> Loki via endpoint OTLP nativo (o exporter `loki`
            # legado saiu do contrib; Loki 3.x aceita OTLP em /otlp).
            otlp_http/loki:
              endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
          service:
            pipelines:
              logs:
                exporters: [otlp_http/loki]
                processors: [memory_limiter, batch]
                receivers: [otlp]
              metrics:
                exporters: [prometheus]
                processors: [memory_limiter, batch]
                receivers: [otlp]
              traces:
                exporters: [otlp_grpc/tempo]
                processors: [memory_limiter, batch]
                receivers: [otlp]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
