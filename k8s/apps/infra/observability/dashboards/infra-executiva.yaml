apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-infra-executiva
  namespace: monitoring
  labels:
    grafana_dashboard: "1" # sidecar do stack importa automaticamente
data:
  infra-executiva.json: |-
    {
      "title": "Infra Executiva",
      "uid": "infra-executiva",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "title": "CPU cluster %", "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))" }],
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 }
        },
        {
          "title": "Memória cluster %", "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))" }],
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 }
        },
        {
          "title": "Disco / por node %", "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 * max by (instance) (1 - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"rootfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"rootfs\"})" }],
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 }
        },
        {
          "title": "Pods por namespace", "type": "barchart",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "count by (namespace) (kube_pod_info)" }],
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 }
        },
        {
          "title": "CPU por node", "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))" }],
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 4 }
        },
        {
          "title": "Memória por node", "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)" }],
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 4 }
        },
        {
          "title": "Top pods CPU", "type": "table",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "topk(10, sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m])))" }],
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 10 }
        },
        {
          "title": "Top pods memória", "type": "table",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "topk(10, sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\"}))" }],
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 10 }
        },
        {
          "title": "Uso de PVC %", "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes" }],
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 16 }
        }
      ]
    }
