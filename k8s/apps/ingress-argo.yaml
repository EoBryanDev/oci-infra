apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # Backend fala HTTP (porta 80 -> 8080 do argocd-server).
    # O TLS termina no Traefik com o Origin Cert; a Cloudflare valida
    # esse cert em modo Full (strict). Sem HTTPS no backend = sem
    # insecureSkipVerify, sem ServerTransport custom.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argo.synit.top
      secretName: argo-origin-tls # criado pelo role Ansible `tls`, nunca commitado
  rules:
    - host: argo.synit.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
