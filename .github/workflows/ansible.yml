name: Deploy Infra (OCI) e K3s

on:
  workflow_dispatch:
    inputs:
      acao_terraform:
        description: "Ação da Infraestrutura (Terraform)"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
      rodar_ansible:
        description: "Executar configuração do K3s (Ansible)?"
        required: true
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Preparar Chaves e Autenticação OCI/SSH
        run: |
          mkdir -p ~/.ssh ~/.oci

          # 1. Chave SSH (Ansible -> VMs)
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/oracle_k3s
          chmod 400 ~/.ssh/oracle_k3s

          # 2. Chave API OCI (Terraform -> Oracle)
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 400 ~/.oci/oci_api_key.pem

          # 3. Criar arquivo de config OCI para o Terraform ler
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="address=${{ secrets.TF_BACKEND_PAR_URL }}" \
            -backend-config="update_method=PUT"

      - name: Executar Terraform (${{ github.event.inputs.acao_terraform }})
        working-directory: ./terraform
        env:
          # Variáveis de Autenticação (Faltantes)
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}

          # Variáveis de Infraestrutura e Acesso
          TF_VAR_compartment_id: ${{ secrets.TF_VAR_COMPARTMENT_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
          TF_VAR_meu_ip: ${{ secrets.TF_VAR_MEU_IP }}
          TF_VAR_MEU_IP_ADM: ${{ secrets.TF_VAR_MEU_IP_ADM }}
          TF_VAR_availability_domain: ${{ vars.TF_VAR_AVAILABILITY_DOMAIN }}
          TF_VAR_image_id: ${{ vars.TF_VAR_IMAGE_ID }}
        run: terraform ${{ github.event.inputs.acao_terraform }} -auto-approve -input=false

      - name: Executar Ansible Playbook
        # O Ansible só roda se o Terraform foi "apply" e se você marcou a caixa "rodar_ansible"
        if: ${{ github.event.inputs.acao_terraform == 'apply' && github.event.inputs.rodar_ansible == 'true' }}
        working-directory: ./ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          ansible-playbook -i inventory/hosts.ini site.yml --private-key ~/.ssh/oracle_k3s
